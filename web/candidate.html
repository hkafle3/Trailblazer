<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Candidate · Trailblazer</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="ui.css">
<link rel="stylesheet" href="patch.css">
<link rel="stylesheet" href="header.css">
<link rel="stylesheet" href="discuss.css">
<link rel="stylesheet" href="thenandnow.css">
<link rel="stylesheet" href="colors.css">
</head>
<body class="page">
<header class="topbar">
  <a class="brand" href="./" aria-label="Trailblazer home"><span class="brand-mark" aria-hidden="true"></span><span class="brand-name">Trailblazer</span></a>
  <nav><a href="comet.html">Comets</a><a href="explore.html">Explore</a><a href="forums.html">Forums</a><a class="on" href="candidates.html">Candidates</a></nav>
</header>

<!-- A dot someone reported from a time-lapse ("Discuss this", POST /api/candidates). Laid out from Ming's Forums.png:
     wide boxes on the left, a card column on the right, every part one of his patch-viewer components (discuss.css). -->
<main class="cpage">
  <div class="left">
    <section class="pv-frame head">
      <h1 id="c-id">&nbsp;</h1>
      <span class="pv-info status" id="c-status-wrap"><i aria-hidden="true"></i><span id="c-status"></span></span>
      <span class="pv-info byline" id="c-by"></span>
      <p class="pv-info known-line" id="c-known" hidden></p>
    </section>
    <!-- Then and now: the older survey against SPHEREx, blinked and measured (thenandnow.js, live/blinkworker.js) -->
    <section class="pv-frame tn" id="tn" aria-labelledby="tn-h"></section>
    <section class="pv-frame" aria-label="The spot at each visit">
      <div class="frames" id="c-frames"></div>
      <p class="pv-info frames-note" id="c-frames-note">Building the frames…</p>
    </section>
    <div class="left" id="c-talk" aria-live="polite"></div>
    <form class="pv-desc compose" id="c-compose">
      <textarea class="box" maxlength="1000" aria-label="Comment" placeholder="Add a comment"></textarea>
      <input class="box nick" maxlength="24" placeholder="Your nickname" aria-label="Your nickname" autocomplete="nickname" hidden>
      <!-- Turnstile site key (public). On localhost the always-pass test key is used instead, to match worker/.dev.vars -->
      <div class="cf-turnstile" data-sitekey="0x4AAAAAAGBTgXAx-fdK_qGx" data-theme="dark" data-size="flexible" data-appearance="interaction-only"></div>
      <div class="row"><span class="pv-info" id="c-note" role="status"></span><button class="pv-state" type="submit" disabled><span>Post</span><span class="go" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 12h16M14 6l6 6-6 6"/></svg></span></button></div>
    </form>
  </div>

  <div class="right">
    <a class="pv-state" id="c-lapse"><span>Time-lapse</span><span class="go" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 12h16M14 6l6 6-6 6"/></svg></span></a>
    <section class="pv-card" aria-labelledby="c-tags-h">
      <h2 id="c-tags-h">Tags</h2>
      <fieldset class="tags" form="c-compose"><legend class="sr-only">Your tag</legend>
        <label class="pv-row" style="--c:var(--comet)"><input class="cbx" type="radio" name="tag" value="comet" form="c-compose"><span>Comet</span><span class="count" data-t="comet">0</span></label>
        <label class="pv-row" style="--c:var(--asteroid)"><input class="cbx" type="radio" name="tag" value="asteroid" form="c-compose"><span>Asteroid</span><span class="count" data-t="asteroid">0</span></label>
        <label class="pv-row" style="--c:var(--glitch)"><input class="cbx" type="radio" name="tag" value="glitch" form="c-compose"><span>Glitch</span><span class="count" data-t="glitch">0</span></label>
        <label class="pv-row" style="--c:var(--unsure)"><input class="cbx" type="radio" name="tag" value="unsure" form="c-compose"><span>Not sure</span><span class="count" data-t="unsure">0</span></label>
        <label class="pv-row" style="--c:var(--star)"><input class="cbx" type="radio" name="tag" value="star" form="c-compose"><span>Star</span><span class="count" data-t="star">0</span></label>
      </fieldset>
    </section>
    <section class="pv-card" aria-labelledby="c-where-h">
      <h2 id="c-where-h">Where it is</h2>
      <a class="where" id="c-find" aria-label="Find it on the Explore map"><div class="skymini"><i id="c-dot"></i></div></a>
      <p class="pv-info where-p" id="c-radec"></p>
    </section>
  </div>
</main>

<script>
  if (['localhost', '127.0.0.1', '[::1]'].includes(location.hostname)) document.querySelector('.cf-turnstile').dataset.sitekey = '1x00000000000000000000AA';
</script>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
<script type="module" src="candidate.js"></script>
<script src="ui.js"></script>
</body>
</html>
