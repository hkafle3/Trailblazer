<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Comet · Comet Catcher</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="ui.css">
</head>
<body class="page">

<header class="topbar glass">
  <a class="brand" href="./"><span class="brand-mark"></span>Comet Catcher</a>
  <nav><a href="./">Explore</a><a class="on" href="comet.html">Comets</a><a href="guide.html">Guide</a></nav>
  <label class="search"><svg class="ic"><use href="icons.svg#search"/></svg><input placeholder="Comet or sky position" aria-label="Search" disabled></label>
</header>

<main class="shell">
  <div class="comet-head">
    <h1 id="c-id">&nbsp;</h1>
    <span class="chip likely" id="c-verdict" hidden></span>
    <span class="chip cat" id="c-cat"><svg class="ic" style="width:15px;height:15px"><use href="icons.svg#known"/></svg><span></span></span>
    <a class="btn ghost" id="c-patch" hidden>Open its patch <svg class="ic"><use href="icons.svg#arrow"/></svg></a>
  </div>

  <div class="comet-grid">
    <div class="col">
      <section class="panel glass empty-card" id="c-empty" hidden>
        <h2>Where it is</h2>
        <div class="skymini" id="c-mini"><i id="c-mini-dot"></i></div>
        <p class="where" id="c-where"></p>
        <p>Example comet: its photos and spectrum appear here once its dots are measured.</p>
        <div class="actions"><a class="btn ghost" href="comet.html?id=3I%2FATLAS">See a real one: 3I/ATLAS</a></div>
      </section>

      <section class="panel glass" id="c-photos-panel" hidden>
        <div class="nights" id="c-photos"></div>
      </section>

      <section class="glass measures" id="c-measures" hidden>
        <div title="Speed across the sky"><svg class="ic"><use href="icons.svg#speed"/></svg><b><span data-f="speed"></span> <small>arcsec / hour</small></b></div>
        <div title="Direction of travel"><svg class="ic"><use href="icons.svg#compass"/></svg><b data-f="dir"></b></div>
        <div title="First photographed by SPHEREx"><svg class="ic"><use href="icons.svg#calendar"/></svg><b data-f="first"></b></div>
        <div title="SPHEREx photos of it"><svg class="ic"><use href="icons.svg#stack"/></svg><b><span data-f="n"></span> <small>photos</small></b></div>
      </section>

      <section class="panel glass spectrum" id="c-spec-panel" hidden>
        <div class="head"><h2>Light by wavelength</h2><span class="example" id="c-spec-note"></span></div>
        <svg id="spec" viewBox="0 0 900 250" role="img" aria-label="SPHEREx spectrum of the comet"></svg>
        <div class="legend" id="c-legend"></div>
      </section>
    </div>

    <aside class="talk glass">
      <div class="verdict">
        <h2 id="t-head">&nbsp;</h2>
        <div class="tally"><i class="t-comet"></i><i class="t-asteroid"></i><i class="t-glitch"></i><i class="t-unsure"></i></div>
        <div class="tally-key"><span class="t-comet">Comet <b data-t="comet">0</b></span><span class="t-asteroid">Asteroid <b data-t="asteroid">0</b></span><span class="t-glitch">Glitch <b data-t="glitch">0</b></span><span class="t-unsure">Not sure <b data-t="unsure">0</b></span></div>
      </div>
      <div id="t-list"></div>

      <form class="composer">
        <div class="tagpick" role="radiogroup" aria-label="Your tag">
          <label><input type="radio" name="tag" value="comet"><span class="tag comet">Comet</span></label>
          <label><input type="radio" name="tag" value="asteroid"><span class="tag asteroid">Asteroid</span></label>
          <label><input type="radio" name="tag" value="glitch"><span class="tag glitch">Glitch</span></label>
          <label><input type="radio" name="tag" value="unsure"><span class="tag unsure">Not sure</span></label>
        </div>
        <input class="nick" name="author" maxlength="24" placeholder="Your nickname" aria-label="Your nickname" autocomplete="nickname" hidden>
        <textarea rows="2" maxlength="1000" placeholder="Add a comment" aria-label="Your comment"></textarea>
        <!-- Turnstile site key (public). On localhost the always-pass test key is used instead, to match the test secret in worker/.dev.vars -->
        <div class="cf-turnstile" data-sitekey="0x4AAAAAAGBTgXAx-fdK_qGx" data-theme="dark" data-size="flexible" data-appearance="interaction-only"></div>
        <div class="row"><span class="faint" id="c-note" role="status" style="font-size:12.5px">A tag is optional. It counts as your vote.</span><button class="btn small" type="submit" disabled>Post</button></div>
      </form>
    </aside>
  </div>
</main>

<script>
  if (['localhost', '127.0.0.1', '[::1]'].includes(location.hostname)) document.querySelector('.cf-turnstile').dataset.sitekey = '1x00000000000000000000AA';
</script>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
<script type="module" src="comet.js"></script>
<script src="ui.js"></script>
</body>
</html>
