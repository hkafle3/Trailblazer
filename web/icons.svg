<svg xmlns="http://www.w3.org/2000/svg">
  <!-- Comet Catcher icon set. 24px grid, 1.6 stroke, round caps. Use: <svg class="ic"><use href="icons.svg#eye"/></svg> -->
  <defs>
    <style>symbol{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}</style>
  </defs>
  <!-- SPHEREx photos: a square patch of sky with corner ticks -->
  <symbol id="photo" viewBox="0 0 24 24"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"/><circle cx="12" cy="12" r="1.2" fill="currentColor" stroke="none"/><circle cx="15.5" cy="9" r=".8" fill="currentColor" stroke="none"/><circle cx="9" cy="15" r=".8" fill="currentColor" stroke="none"/></symbol>
  <!-- Explored by people -->
  <symbol id="eye" viewBox="0 0 24 24"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="2.8"/></symbol>
  <!-- Comet -->
  <symbol id="comet" viewBox="0 0 24 24"><circle cx="7.5" cy="16.5" r="3"/><path d="M10 14 20 4M11 17.5l7-4M6.5 13l4-7"/></symbol>
  <!-- Known catalog object -->
  <symbol id="known" viewBox="0 0 24 24"><circle cx="12" cy="12" r="2.2"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3"/></symbol>
  <symbol id="search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></symbol>
  <symbol id="play" viewBox="0 0 24 24"><path d="M8 5.5v13l10.5-6.5Z" fill="currentColor"/></symbol>
  <symbol id="arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
  <symbol id="book" viewBox="0 0 24 24"><path d="M12 6.5C10 5 7 4.5 4 5v13c3-.5 6 0 8 1.5 2-1.5 5-2 8-1.5V5c-3-.5-6 0-8 1.5ZM12 6.5v13"/></symbol>
  <!-- Patch tools -->
  <symbol id="side" viewBox="0 0 24 24"><rect x="3" y="6" width="7.5" height="12" rx="1.5"/><rect x="13.5" y="6" width="7.5" height="12" rx="1.5"/></symbol>
  <symbol id="blink" viewBox="0 0 24 24"><rect x="4" y="4" width="12" height="12" rx="2" stroke-dasharray="2.5 3"/><rect x="8" y="8" width="12" height="12" rx="2"/></symbol>
  <symbol id="minus" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M8 12h8"/></symbol>
  <symbol id="invert" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5a8.5 8.5 0 0 1 0 17Z" fill="currentColor"/></symbol>
  <symbol id="contrast" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3 7 7M17 17l1.7 1.7M5.3 18.7 7 17M17 7l1.7-1.7"/></symbol>
  <!-- Measurements -->
  <symbol id="move" viewBox="0 0 24 24"><circle cx="5.5" cy="17.5" r="2" stroke-dasharray="1.5 2"/><circle cx="18" cy="6.5" r="2.5" fill="currentColor"/><path d="m8 15 6.5-5.5" stroke-dasharray="1 3"/></symbol>
  <symbol id="clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3.5 2"/></symbol>
  <symbol id="fuzzy" viewBox="0 0 24 24"><circle cx="12" cy="12" r="2.5" fill="currentColor"/><circle cx="12" cy="12" r="6" stroke-dasharray="1 3"/><circle cx="12" cy="12" r="9.5" stroke-dasharray="1 4.5" opacity=".6"/></symbol>
  <symbol id="speed" viewBox="0 0 24 24"><path d="M4.5 17a8.5 8.5 0 1 1 15 0M12 13l4-5"/><circle cx="12" cy="13" r="1" fill="currentColor"/></symbol>
  <symbol id="compass" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="m15.5 8.5-2 5-5 2 2-5Z"/></symbol>
  <symbol id="calendar" viewBox="0 0 24 24"><rect x="4" y="5.5" width="16" height="14.5" rx="2.5"/><path d="M4 10h16M8.5 3.5v4M15.5 3.5v4"/></symbol>
  <symbol id="stack" viewBox="0 0 24 24"><rect x="4" y="8" width="13" height="12" rx="2"/><path d="M7.5 4.5H18A2 2 0 0 1 20 6.500V17"/></symbol>
  <symbol id="chat" viewBox="0 0 24 24"><path d="M4.5 6.500a2 2 0 0 1 2-2h11a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H11l-4.500 3.500v-3.500a2 2 0 0 1-2-2Z"/></symbol>
</svg>
