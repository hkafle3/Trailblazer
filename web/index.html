<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trailblazer</title>
<meta name="description" content="Find comets in NASA SPHEREx images. Anyone can look.">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="ui.css">
<link rel="stylesheet" href="header.css">
<link rel="preload" as="image" href="data/home/earth.png" fetchpriority="high">
<link rel="preload" as="image" href="data/sky.jpg">
<style>
  /* Homepage-1: the SPHEREx sky behind Earth's limb, the spacecraft above it. Laid out in design pixels
     (2944 x 1509) scaled to cover the window, anchored to the bottom so Earth always meets the bottom edge. */
  body.home { background: #000; height: 100vh; height: 100dvh; overflow: hidden; }
  .scene {
    --s: max(calc(100vw / 2944), calc(100vh / 1509));
    position: fixed; left: 50%; bottom: 0; width: calc(2944 * var(--s)); height: calc(1509 * var(--s)); transform: translateX(-50%);
  }
  .scene > * { position: absolute; display: block; }
  .scene img { width: 100%; height: auto; user-select: none; -webkit-user-drag: none; }
  .home-sky { left: calc(243 * var(--s)); top: calc(162 * var(--s)); width: calc(2458 * var(--s)); aspect-ratio: 2 / 1; border-radius: 50%; overflow: hidden; }
  /* the oval's edge fades out, and #home-stars carries its stars on past it (FEATHER in the script below matches 86%) */
  .home-sky { mask-image: radial-gradient(closest-side, #000 86%, transparent); }
  #home-stars { position: fixed; left: 0; top: 0; pointer-events: none; }
  .home-sky img { height: 100%; filter: grayscale(1) brightness(.9) contrast(1.05); transition: filter .5s; }
  .home-sky:hover img { filter: grayscale(1) brightness(1.1) contrast(1.05); }
  .earth { left: 0; top: calc(706 * var(--s)); width: 100%; pointer-events: none; }
  .craft { left: calc(1225 * var(--s)); top: calc(475 * var(--s)); width: calc(495 * var(--s)); z-index: 1; }
  .craft img { transition: transform .6s var(--ease); }
  .craft:hover img { transform: translateY(calc(-10 * var(--s))); }
  .scene a:focus-visible { outline: 2px solid #fff; outline-offset: 6px; }
  .scene { cursor: pointer; }
  .home-sky { view-transition-name: sky; }   /* the same name as the Explore map: the oval glides into place there */

  /* Leaving for Explore: Earth and SPHEREx drop away and fade, then the page changes. */
  .earth, .craft { transition: transform .9s cubic-bezier(.55, 0, .8, .2), opacity .8s ease-in; }
  .leaving .earth { transform: translateY(45%); opacity: 0; }
  .leaving .craft { transform: translateY(calc(520 * var(--s))) scale(.9); opacity: 0; transition-delay: .05s; }
  .leaving .home-sky img { filter: grayscale(.6) brightness(1.2) contrast(1.05); }
  .leaving .scene { cursor: default; }
  @media (prefers-reduced-motion: reduce) { .craft img, .home-sky img, .earth, .craft { transition: none; } }
</style>
</head>
<body class="home nostars">

<header class="topbar">
  <a class="brand" href="./" aria-label="Trailblazer home"><span class="brand-mark" aria-hidden="true"></span><span class="brand-name">Trailblazer</span></a>
  <nav><a href="comet.html">Comets</a><a href="explore.html">Explore</a><a href="forums.html">Forums</a></nav>
</header>

<canvas id="home-stars" aria-hidden="true"></canvas>
<main class="scene">
  <h1 class="sr-only">Trailblazer: find comets in NASA SPHEREx images</h1>
  <a class="home-sky" href="explore.html" title="Explore the sky" aria-label="Explore the whole sky SPHEREx has photographed"><img src="data/sky.jpg" alt=""></a>
  <img class="earth" src="data/home/earth.png" alt="" fetchpriority="high">
  <a class="craft" href="explore.html" title="Explore the sky" aria-label="Explore with SPHEREx"><img src="data/home/spherex.png" alt="The SPHEREx space telescope"></a>
</main>

<script>
  // Click anywhere on the scene, or the Explore tab: drop Earth and SPHEREx, then go to Explore.
  (() => {
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    let going = false;
    const go = e => {
      if (e.button || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;   // new tab etc.: let the browser do it
      e.preventDefault();
      if (going) return;
      going = true;
      if (reduce) { location.href = 'explore.html'; return; }
      document.body.classList.add('leaving');
      setTimeout(() => { location.href = 'explore.html'; }, 850);
    };
    document.querySelector('.scene').addEventListener('click', go);
    document.querySelector('.topbar nav a[href="explore.html"]').addEventListener('click', go);
    addEventListener('pageshow', () => { going = false; document.body.classList.remove('leaving'); });   // back button: show the scene again
  })();
</script>
<script>
  // Stars past the oval, so the black around it is not empty: single-pixel stars like sky.jpg's (density and brightness
  // measured from its quiet, Milky-Way-free parts), drawn at the image's own scale so they look the same, fading in across
  // the oval's feathered edge. Seeded by place in the scene, so they never reshuffle. Drawn once, and again on resize.
  (() => {
    const cv = document.getElementById('home-stars'), sky = document.querySelector('.home-sky'), g = cv.getContext('2d');
    const PEAK = [13, 25, 29, 31, 33, 34, 35, 36, 37, 39, 40, 43, 54, 59, 64, 74, 84, 97, 113, 136, 250];   // sky.jpg star peaks, 5% steps
    const DENSITY = .05, FEATHER = .86;   // stars per sky.jpg pixel (its quiet parts have .054); where the oval's fade starts
    const hash = (a, b) => {
      let n = Math.imul(a, 0x9e3779b1) ^ Math.imul(b, 0x85ebca77);
      n ^= n >>> 16; n = Math.imul(n, 0x7feb352d); n ^= n >>> 15; n = Math.imul(n, 0x846ca68b); n ^= n >>> 16;
      return (n >>> 0) / 4294967296;
    };
    const draw = () => {
      const r = sky.getBoundingClientRect(), k = r.width / 2000;   // CSS pixels per sky.jpg pixel
      const w = Math.ceil(innerWidth / k), h = Math.ceil(innerHeight / k);
      const cx = (r.left + r.width / 2) / k, cy = (r.top + r.height / 2) / k, rx = r.width / 2 / k, ry = r.height / 2 / k;
      const img = g.createImageData(w, h), d = img.data;
      for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
        const i = (y * w + x) * 4; d[i + 3] = 255;
        const e = Math.hypot((x + .5 - cx) / rx, (y + .5 - cy) / ry);
        const keep = Math.min(1, (e - FEATHER) / (1 - FEATHER));   // 0 inside the oval, 1 past its edge: the mask, turned over
        if (keep <= 0) continue;
        const u = hash(Math.round(x - cx), Math.round(y - cy)) / (DENSITY * keep);
        if (u >= 1) continue;
        const t = u * 20, j = Math.floor(t), v = PEAK[j] + (PEAK[j + 1] - PEAK[j]) * (t - j);
        d[i] = d[i + 1] = d[i + 2] = .945 * v - 6.4;   // the oval's filter: brightness(.9) contrast(1.05)
      }
      cv.width = w; cv.height = h; cv.style.width = w * k + 'px'; cv.style.height = h * k + 'px';
      g.putImageData(img, 0, 0);
    };
    let queued = 0;
    addEventListener('resize', () => { cancelAnimationFrame(queued); queued = requestAnimationFrame(draw); });
    draw();
  })();
</script>
<script src="ui.js"></script>
</body>
</html>
