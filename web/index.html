<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trailblazer</title>
<meta name="description" content="Find comets in NASA SPHEREx images. Anyone can look.">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="ui.css">
<link rel="stylesheet" href="header.css">
<link rel="preload" as="image" href="data/home/earth.png" fetchpriority="high">
<link rel="preload" as="image" href="data/sky.jpg">
<style>
  /* Homepage-1: the SPHEREx sky behind Earth's limb, the spacecraft above it. Laid out in design pixels
     (2944 x 1509) scaled to cover the window, anchored to the bottom so Earth always meets the bottom edge. */
  body.home { background: #000; height: 100vh; height: 100dvh; overflow: hidden; }
  .scene {
    --s: max(calc(100vw / 2944), calc(100vh / 1509));
    position: fixed; left: 50%; bottom: 0; width: calc(2944 * var(--s)); height: calc(1509 * var(--s)); transform: translateX(-50%);
  }
  .scene > * { position: absolute; display: block; }
  .scene img { width: 100%; height: auto; user-select: none; -webkit-user-drag: none; }
  .home-sky { left: calc(243 * var(--s)); top: calc(162 * var(--s)); width: calc(2458 * var(--s)); aspect-ratio: 2 / 1; border-radius: 50%; overflow: hidden; }
  /* the oval's edge fades out, and #home-stars carries its stars on past it (FEATHER in the script below matches 86%) */
  .home-sky { mask-image: radial-gradient(closest-side, #000 86%, transparent); }
  #home-stars { position: fixed; left: 0; top: 0; pointer-events: none; }
  .home-sky img { height: 100%; filter: grayscale(1) brightness(.9) contrast(1.05); transition: filter .5s; }
  .home-sky:hover img { filter: grayscale(1) brightness(1.1) contrast(1.05); }
  .earth { left: 0; top: calc(706 * var(--s)); width: 100%; pointer-events: none; }
  .craft { left: calc(1225 * var(--s)); top: calc(475 * var(--s)); width: calc(495 * var(--s)); z-index: 1; }
  .craft img { transition: transform .6s var(--ease); }
  .craft:hover img { transform: translateY(calc(-10 * var(--s))); }
  .scene a:focus-visible { outline: 2px solid #fff; outline-offset: 6px; }
  .scene { cursor: pointer; -webkit-tap-highlight-color: transparent; }   /* no tinted flash over the whole scene on tap */
  .home-sky { view-transition-name: sky; }   /* the same name as the Explore map: the oval glides into place there */

  /* Leaving for Explore: a lift-off. The camera rises off Earth toward the sky, so the nearer a layer is, the further it
     moves: Earth falls away and fades into the dark, SPHEREx climbs on into the sky and shrinks with distance, the oval
     grows a touch (the Explore map takes it from there) and the stars barely drift. Transform and opacity only. */
  :root { --lift: cubic-bezier(.3, 0, .65, .45); --lift-out: cubic-bezier(.45, 0, .2, 1); }
  .earth { transform-origin: 50% 0; scale: 1.01; }   /* 1% spare, so the idle drift below never shows its side edges */
  .earth img { position: relative; transition: opacity .65s ease-in; }
  /* Earth's black silhouette behind it: the picture fades into it, so Earth darkens as it falls instead of turning see-through */
  .earth::before { content: ""; position: absolute; inset: 0; background: #000; mask: url(data/home/earth.png) 0 0 / 100% 100%; }
  .earth, .craft, .home-sky, #home-stars { transition: translate .9s var(--ease), transform 1s var(--lift), opacity .9s ease-in; }
  .home-sky, #home-stars { transition-timing-function: var(--ease), var(--lift-out), ease-in; }
  .leaving .earth { transform: translateY(75%) scale(.9); opacity: 0; transition-duration: .9s, 1s, .4s; transition-delay: 0s, 0s, .55s; }
  .leaving .earth img { opacity: 0; }
  .leaving .craft { transform: translateY(calc(-420 * var(--s))) scale(.5); opacity: 0; transition-duration: .9s, .95s, .45s; transition-delay: 0s, 0s, .45s; }
  .leaving .home-sky { transform: scale(1.035); }
  .leaving #home-stars { transform: scale(1.015); }   /* about the oval's centre, set by the star script */
  .leaving .home-sky img { filter: grayscale(.6) brightness(1.2) contrast(1.05); }
  .leaving .scene { cursor: default; }
  /* Idle: the mouse tilts the view a few pixels, nearer layers more (the script sets --mx and --my, -1 to 1) */
  #home-stars { translate: calc(var(--mx, 0) * -2px) calc(var(--my, 0) * -1px); }
  .home-sky { translate: calc(var(--mx, 0) * -4px) calc(var(--my, 0) * -2px); }
  .earth { translate: calc(var(--mx, 0) * -8px) calc(var(--my, 0) * -4px); }
  .craft { translate: calc(var(--mx, 0) * -11px) calc(var(--my, 0) * -6px); }
  @media (prefers-reduced-motion: reduce) { .craft img, .home-sky img, .earth, .earth img, .craft, .home-sky, #home-stars { transition: none; } }

  /* The headline and the way in (home variant A, "Quiet"): small, in the dark above the horizon's left shoulder, one
     typeface (the header's Sansation), a plain underlined link with a small orange arrow. Its top keeps the same height
     above Earth's limb at any window size (946 design pixels up from the scene's bottom: 336 px at 1440 x 900), never under the header */
  .qa { position: absolute; z-index: 2; left: 72px; top: max(calc(var(--head-h) + 24px), calc(100vh - 946 * max(100vw / 2944, 100vh / 1509))); width: 380px; font-family: var(--head-font); transition: opacity .4s ease-in; }
  .qa h1 { margin: 0; font: 300 24px/1.35 var(--head-font); color: #fff; text-wrap: balance; text-shadow: 0 1px 14px #000, 0 0 4px #000; }
  .qa .cta { display: flex; width: max-content; align-items: center; gap: 12px; margin-top: 22px; padding-bottom: 6px; border-bottom: 1px solid rgba(255, 255, 255, .55);
    font: 400 17px/1 var(--head-font); color: #fff; text-decoration: none; white-space: nowrap; }
  .qa .cta:hover { border-bottom-color: #fff; }
  .qa .cta:focus-visible { outline: 2px solid #fff; outline-offset: 6px; }
  .qa .arr { width: 18px; height: 18px; flex: none; fill: none; stroke: #ff9a4d; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  /* a second, quieter line under the link: the intro film, which plays on Explore and ends on the map. Smaller, dimmer, no rule under it; 44 px tall to press */
  .qa .watch { display: inline-flex; align-items: center; gap: 9px; margin-top: 5px; padding: 15px 0; font: 400 14px/1 var(--head-font); color: rgba(255, 255, 255, .72);
    text-decoration: none; text-shadow: 0 1px 10px #000; white-space: nowrap; }
  .qa .watch:hover { color: #fff; }
  .qa .watch:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  .qa .watch .play { width: 11px; height: 11px; flex: none; fill: currentColor; }
  /* the length is the same color as its line: at 1280 px wide it sits over a brighter patch of the art, and anything dimmer falls under 4.5 to 1 there */
  .leaving .qa { opacity: 0; }
  /* phones: low on the screen, where the Earth turns to night; a soft fade under it keeps it readable */
  @media (max-width: 500px) {
    body.home::after { content: ""; position: fixed; z-index: 1; left: 0; right: 0; bottom: 0; height: 400px; pointer-events: none;
      background: linear-gradient(to top, rgba(0, 0, 0, .94), rgba(0, 0, 0, .78) 55%, transparent); }
    .qa { left: 24px; right: 24px; top: auto; bottom: 48px; width: auto; }
    .qa h1 { font-size: 21px; line-height: 1.38; }
    .qa .cta { margin-top: 20px; font-size: 16px; }
    .qa .watch { margin-top: 3px; font-size: 13.5px; }
  }
</style>
</head>
<body class="home nostars">

<header class="topbar">
  <a class="brand" href="./" aria-label="Trailblazer home"><span class="brand-mark" aria-hidden="true"></span><span class="brand-name">Trailblazer</span></a>

</header>

<canvas id="home-stars" aria-hidden="true"></canvas>
<main class="scene">
  <a class="home-sky" href="explore.html" title="Explore the sky" aria-label="Explore the whole sky SPHEREx has photographed"><img src="data/sky.jpg" alt=""></a>
  <div class="earth"><img src="data/home/earth.png" alt="" fetchpriority="high"></div>
  <a class="craft" href="explore.html" title="Explore the sky" aria-label="Explore with SPHEREx"><img src="data/home/spherex.png" alt="The SPHEREx space telescope"></a>
</main>
<!-- Barnard's Star: the fastest-moving star in the sky, bright, and its step across the year of photos is plain to see -->
<div class="qa">
  <h1>Find objects that move in space, in photos from NASA's SPHEREx telescope.</h1>
  <a class="cta" href="timelapse.html?target=barnard">Start with a real example<svg class="arr" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h16M14 6l6 6-6 6"/></svg></a>
  <!-- the intro film "How this map was made" (intro.js): it plays over Explore and ends on the map. The length is the film's, to the second (home_ui.py checks it) -->
  <a class="watch" href="explore.html?intro=1"><svg class="play" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3.5v17l15-8.5z"/></svg>Watch the intro <span class="dur">(55 s)</span></a>
</div>

<script>
  // Click anywhere on the scene, or the Explore tab: drop Earth and SPHEREx, then go to Explore.
  (() => {
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    let going = false;
    const go = e => {
      if (e.button || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;   // new tab etc.: let the browser do it
      e.preventDefault();
      if (going) return;
      going = true;
      if (reduce) { location.href = 'explore.html'; return; }
      document.body.classList.add('leaving');
      setTimeout(() => { location.href = 'explore.html'; }, 950);
    };
    document.querySelector('.scene').addEventListener('click', go);
    document.querySelector('.topbar nav a[href="explore.html"]').addEventListener('click', go);
    addEventListener('pageshow', () => { going = false; document.body.classList.remove('leaving'); });   // back button: show the scene again
    // the idle tilt: desktop pointers only, not for less motion; read once a frame
    if (reduce || !matchMedia('(hover: hover) and (pointer: fine)').matches) return;
    let x = 0, y = 0, queued = 0;
    addEventListener('pointermove', e => {
      x = e.clientX / innerWidth * 2 - 1; y = e.clientY / innerHeight * 2 - 1;
      queued ||= requestAnimationFrame(() => { queued = 0; document.body.style.setProperty('--mx', x.toFixed(3)); document.body.style.setProperty('--my', y.toFixed(3)); });
    });
  })();
</script>
<script>
  // Stars past the oval, so the black around it is not empty: single-pixel stars like sky.jpg's (density and brightness
  // measured from its quiet, Milky-Way-free parts), drawn at the image's own scale so they look the same, fading in across
  // the oval's feathered edge. Seeded by place in the scene, so they never reshuffle. Drawn once, and again on resize.
  (() => {
    const cv = document.getElementById('home-stars'), sky = document.querySelector('.home-sky'), g = cv.getContext('2d');
    const PEAK = [13, 25, 29, 31, 33, 34, 35, 36, 37, 39, 40, 43, 54, 59, 64, 74, 84, 97, 113, 136, 250];   // sky.jpg star peaks, 5% steps
    const DENSITY = .05, FEATHER = .86;   // stars per sky.jpg pixel (its quiet parts have .054); where the oval's fade starts
    const hash = (a, b) => {
      let n = Math.imul(a, 0x9e3779b1) ^ Math.imul(b, 0x85ebca77);
      n ^= n >>> 16; n = Math.imul(n, 0x7feb352d); n ^= n >>> 15; n = Math.imul(n, 0x846ca68b); n ^= n >>> 16;
      return (n >>> 0) / 4294967296;
    };
    const draw = () => {
      const r = sky.getBoundingClientRect(), k = r.width / 2000;   // CSS pixels per sky.jpg pixel
      const w = Math.ceil(innerWidth / k), h = Math.ceil(innerHeight / k);
      const cx = (r.left + r.width / 2) / k, cy = (r.top + r.height / 2) / k, rx = r.width / 2 / k, ry = r.height / 2 / k;
      const img = g.createImageData(w, h), d = img.data;
      for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
        const i = (y * w + x) * 4; d[i + 3] = 255;
        const e = Math.hypot((x + .5 - cx) / rx, (y + .5 - cy) / ry);
        const keep = Math.min(1, (e - FEATHER) / (1 - FEATHER));   // 0 inside the oval, 1 past its edge: the mask, turned over
        if (keep <= 0) continue;
        const u = hash(Math.round(x - cx), Math.round(y - cy)) / (DENSITY * keep);
        if (u >= 1) continue;
        const t = u * 20, j = Math.floor(t), v = PEAK[j] + (PEAK[j + 1] - PEAK[j]) * (t - j);
        d[i] = d[i + 1] = d[i + 2] = .945 * v - 6.4;   // the oval's filter: brightness(.9) contrast(1.05)
      }
      cv.width = w; cv.height = h; cv.style.width = w * k + 'px'; cv.style.height = h * k + 'px';
      cv.style.transformOrigin = `${cx * k}px ${cy * k}px`;   // the lift-off grows the stars about the oval's centre
      g.putImageData(img, 0, 0);
    };
    let queued = 0;
    addEventListener('resize', () => { cancelAnimationFrame(queued); queued = requestAnimationFrame(draw); });
    draw();
  })();
</script>
<script src="ui.js"></script>
