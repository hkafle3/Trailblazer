<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Patch viewer · Trailblazer</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="ui.css">
<link rel="stylesheet" href="patch.css">
<link rel="stylesheet" href="header.css">
</head>
<body class="lapse nostars">
<canvas id="gl"></canvas>

<header class="topbar">
  <a class="brand" href="./" aria-label="Trailblazer home"><span class="brand-mark" aria-hidden="true"></span><span class="brand-name">Trailblazer</span></a>
  <nav><a href="comet.html">Comets</a><a class="on" href="explore.html">Explore</a><a href="forums.html">Forums</a></nav>
</header>

<!-- Laid out from design/frontend-refactor/Explore.png (patch.css). Left: Options, Layers, Others. Middle: the patch.
     Right: the whole region as a mini-map, Discovered/Undiscovered, Descriptions. Bottom: Explore's month timeline. -->
<div class="pstage" id="stage">
  <section class="pv-card pv-options" aria-label="Options">
    <h2>Options</h2>
    <label class="pv-row" for="fov">Zoom <input id="fov" type="range" min="1" max="12" step="0.5" value="6" aria-valuetext="6 arcmin wide"></label>
  </section>
  <section class="pv-card pv-layers" aria-label="Layers">
    <h2>Layers</h2>
    <label class="pv-row"><input class="cbx" type="checkbox" id="ly-spec"><span>Spectral</span></label>
    <label class="pv-row"><input class="cbx" type="checkbox" id="ly-heat"><span>Heat</span></label>
  </section>
  <section class="pv-card pv-others" aria-label="Others">
    <h2>Others</h2>
    <label class="pv-row"><input class="cbx" type="checkbox" id="still"><span>Hide Stationary</span></label>
    <label class="pv-row"><input class="cbx" type="checkbox" id="diff"><span>Color Difference</span></label>
  </section>

  <div class="pv-frame">
    <canvas id="patch" width="1146" height="902" role="img" aria-label="SPHEREx image of the target"></canvas>
    <div id="status" role="status" aria-live="polite"></div>
    <div id="legend" aria-hidden="true"><span><i style="background:var(--comet)"></i>this visit</span><span><i style="background:var(--known)"></i>earlier visits</span><span><i style="border:2px solid #fff"></i>predicted</span><span><i style="border:1.5px dashed var(--known)"></i>known passing</span></div>
  </div>

  <!-- the whole region SPHEREx cut out for this spot; the white box is the part in the big frame, the ring is the target -->
  <div class="pv-mini"><canvas id="mini" width="868" height="594" role="img" aria-label="The whole region, with the part on screen outlined"></canvas></div>
  <a class="pv-state" id="state" href="forums.html"><span id="state-label">Undiscovered</span><span class="go" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 12h16M14 6l6 6-6 6"/></svg></span></a>

  <section class="pv-card pv-desc" aria-label="Descriptions">
    <h2>Descriptions</h2>
    <form id="search" role="search">
      <label for="coords">Coordinates</label>
      <input class="box" id="coords" placeholder="RA Dec, e.g. 269.4463 4.7671" autocomplete="off" spellcheck="false" enterkeyhint="go">
      <div class="sub"><label for="det">Band</label>
        <select class="box" id="det" aria-label="SPHEREx detector">
          <option value="D1">D1 0.75–1.1 µm</option><option value="D2">D2 1.1–1.6 µm</option><option value="D3">D3 1.6–2.4 µm</option>
          <option value="D4">D4 2.4–3.8 µm</option><option value="D5">D5 3.8–4.4 µm</option><option value="D6">D6 4.4–5.0 µm</option>
        </select></div>
    </form>
    <p class="pv-info" id="vName" hidden></p>
    <p class="pv-info" id="vVisit"></p>
    <p class="pv-info" id="vMotion"></p>
    <p class="pv-info"><b>Known comets and asteroids</b><span id="vKnown" aria-live="polite"></span></p>
  </section>

  <!-- Explore's timeline: a tick per month, the date over the handle, a dot for each visit to this patch.
       Drag to pick a visit; press the handle to play the visits in turn. -->
  <div class="tl" id="tl">
    <div class="tl-line" id="tl-line">
      <div class="tl-ticks" id="tl-ticks" aria-hidden="true"></div>
      <div id="tl-visits" aria-hidden="true"></div>
      <output class="tl-date" id="t-date">&nbsp;</output>
      <button class="tl-knob" id="play" type="button" role="slider" aria-label="Visit. Drag to pick a visit; press to play them in turn." aria-valuemin="0" aria-valuemax="0" aria-valuenow="0">
        <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 5.5v13L6 12z"/></svg>
        <svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="6" width="3.6" height="12" rx="1"/><rect x="13.4" y="6" width="3.6" height="12" rx="1"/></svg>
      </button>
    </div>
  </div>
</div>
<div id="skyui">
  <div id="hint" class="glass"><b>Click any spot</b> to see how it changes over time. Drag to look around, scroll to zoom.</div>
  <div id="mapbox" class="glass"><h2>Sky map: click anywhere to fly there</h2><canvas id="skymap" width="480" height="240" role="img" aria-label="SPHEREx all-sky map"></canvas></div>
  <div id="reticle"></div><div id="readout"></div>
</div>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
import { createWorld, dirRaDec, D2R, HIPS, radec2tile, radecFromDir, tileUV } from './sky.js';

const TARGETS = [
  { key: 'barnard', name: "Barnard's Star" }, { key: 'epsindib', name: 'Epsilon Indi B' }, { key: 'wise0855', name: 'WISE 0855' },
  { key: 'rwaur', name: 'RW Aurigae' }, { key: 'rdra', name: 'R Draconis' }
];
const P = new URLSearchParams(location.search);

// ---------- 3D star field behind everything ----------
const canvas = document.getElementById('gl');
// The star field is decoration: when the browser has WebGL off (a GPU crash, or hardware acceleration disabled),
// skip it so the 2D time-lapse below still works instead of the whole page stopping here.
let renderer = null;
try { renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance' }); renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); }
catch { document.body.classList.add('nogl'); }
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, 1, 0.001, 5000);
function resize() { renderer?.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();
const world = renderer && createWorld({ renderer, scene, camera });
const look = new THREE.Vector3(1, 0, 0), lookGoal = new THREE.Vector3(1, 0, 0), up = new THREE.Vector3(0, 1, 0);

// ---------- data ----------
const cache = new Map();
function prep(m) {
  // Brightness range: up to the target's own peak, so a bright star keeps a compact core instead of a white block
  let peak = 0;
  for (const f of m.frames) if (f.x != null) for (let r = 0; r < m.grid; r++) for (let c = 0; c < m.grid; c++) {
    const v = f.px[r * m.grid + c];
    if (Number.isFinite(v) && Math.hypot(c - f.x, m.grid - 1 - r - f.y) < 3) peak = Math.max(peak, v);
  }
  m.hiDisplay = Math.max(m.stretch.hi, 0.8 * peak);
  return m;
}
function load(key) {
  if (!cache.has(key)) cache.set(key, fetch(`data/flip/${key}/manifest.json`).then(r => r.json()).then(m => {
    m.frames.forEach(f => { const b = atob(f.data), u = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); f.px = new Float32Array(u.buffer); });
    return prep(m);
  }));
  return cache.get(key);
}
TARGETS.forEach(t => load(t.key).catch(() => {}));   // preload: the demo never waits on the network

const state = { m: null, i: 0, playing: false, last: 0, diff: false, still: false, heat: false, spec: false, fov: 6 };   // opens 6 arcmin wide; zoom to 1.5 for a 2-pixel move
const patch = document.getElementById('patch'), ctx = patch.getContext('2d');
const mini = document.getElementById('mini'), mini2d = mini.getContext('2d');
const MONTH = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const monthYear = s => `${MONTH[+s.slice(5, 7) - 1]} ${s.slice(0, 4)}`;

// ---------- discovered or not: Explore's comet markers add found=<id>; anything else is undiscovered ----------
const found = P.get('found');
{
  const el = document.getElementById('state');
  document.getElementById('state-label').textContent = found ? 'Discovered' : 'Undiscovered';
  // Discovered: the arrow opens that comet's page. Undiscovered: the forums, to tell people what you see here.
  el.href = found ? `comet.html?id=${encodeURIComponent(found)}` : 'forums.html';
  el.setAttribute('aria-label', found ? `Discovered: ${found}. Open its page` : 'Undiscovered. Talk about it in the forums');
  if (found) { const n = document.getElementById('vName'); n.hidden = false; n.innerHTML = 'Found as <b></b>'; n.querySelector('b').textContent = found; }
}

// ---------- layers ----------
// Spectral: tint by the band's wavelength, 0.75 µm (blue) to 5 µm (red), the way infrared pictures are usually coloured.
const RAMP = [[0, [120, 170, 255]], [.2, [110, 225, 255]], [.4, [140, 255, 170]], [.6, [255, 235, 120]], [.8, [255, 160, 80]], [1, [255, 95, 95]]];
const HEAT = [[0, [120, 20, 10]], [.45, [235, 70, 30]], [.8, [255, 170, 60]], [1, [255, 245, 190]]];
function ramp(t, stops = RAMP) {
  t = Math.min(1, Math.max(0, t));
  for (let n = 1; n < stops.length; n++) if (t <= stops[n][0]) {
    const [t0, a] = stops[n - 1], [t1, b] = stops[n], f = (t - t0) / (t1 - t0);
    return a.map((v, k) => v + f * (b[k] - v));
  }
  return stops.at(-1)[1];
}
// Per pixel across all visits: the median (what stays put) and a robust spread (how much it changes). Built once per patch.
function stack(m) {
  if (m.med) return;
  const G = m.grid, N = m.frames.length, med = new Float32Array(G * G).fill(NaN), sd = new Float32Array(G * G), v = [];
  for (let k = 0; k < G * G; k++) {
    v.length = 0;
    for (let n = 0; n < N; n++) { const x = m.frames[n].px[k]; if (Number.isFinite(x)) v.push(x); }
    if (!v.length) continue;
    v.sort((a, b) => a - b);
    const mid = v[v.length >> 1]; med[k] = mid;
    if (v.length > 1) { const dev = v.map(x => Math.abs(x - mid)).sort((a, b) => a - b); sd[k] = 1.4826 * dev[dev.length >> 1] + (v.at(-1) - v[0]) / (2 * v.length); }
  }
  const sorted = Array.from(sd).sort((a, b) => a - b);
  m.med = med; m.sd = sd; m.heatHi = Math.max(1e-6, sorted[Math.floor(0.995 * (sorted.length - 1))]);
}

// colour of grid pixel (c, r) of frame f, written to data[j..j+3]
function shade(m, f, c, r, data, j) {
  const G = m.grid, k = r * G + c, v = f.px[k], ref = m.frames[0];
  const { lo, hi: fieldHi } = m.stretch, hi = m.hiDisplay;
  // asinh scaled to the field, with the target's peak as white: a very bright star (Barnard, R Draconis) compresses
  // the curve instead of crushing every other star in a wide view to black
  const A = Math.asinh(10 * (hi - lo) / (fieldHi - lo));
  let rgb;
  if (state.diff && f !== ref) {   // the first visit is the reference: subtracted from itself it is all black, so show the photo
    const d = v - ref.px[k];
    if (!Number.isFinite(d)) rgb = [60, 60, 66];
    else { const a = Math.min(1, Math.abs(d) / Math.max(12, 0.25 * hi)); rgb = d > 0 ? [255 * a, 154 * a, 77 * a] : [127 * a, 184 * a, 255 * a]; }   // 12 noise units, or a quarter of a bright star's peak
  } else {
    // Hide Stationary: take away each pixel's median over all visits, so whatever stays put vanishes and only changes remain
    const x0 = state.still ? v - m.med[k] : v;
    // NaN next to the star means its core saturated the detector: draw it as the brightest value.
    // NaN anywhere else is outside SPHEREx's coverage for that visit: draw it as "no data".
    if (!Number.isFinite(x0) && !(f.x != null && Math.hypot(c - f.x, G - 1 - r - f.y) < 7)) rgb = [22, 26, 34];
    else {
      const x = Number.isFinite(x0) ? Math.asinh(Math.max(0, (x0 - (state.still ? 0 : lo)) / (fieldHi - lo)) * 10) / A : (state.still ? 0 : 1);
      const g = Math.min(1, x);
      rgb = state.spec ? ramp((f.lam - 0.75) / 4.25).map(t => g * t) : [255 * g, 247 * g, 235 * g];
    }
  }
  if (state.heat && m.sd) {   // Heat: the pixels that change most between visits glow, dark red to pale yellow
    const h = Math.min(1, m.sd[k] / m.heatHi);
    if (h > 0.2) { const a = 0.85 * (h - 0.2) / 0.8, hc = ramp(h, HEAT); rgb = rgb.map((t, n) => t * (1 - a) + hc[n] * a); }
  }
  data[j] = rgb[0]; data[j + 1] = rgb[1]; data[j + 2] = rgb[2]; data[j + 3] = 255;
}

// the part of the region the big frame shows: fov arcmin wide, as tall as the frame's shape allows, centred
function view(m) {
  const G = m.grid, cw = Math.min(G, Math.max(2, Math.round(state.fov * 60 / m.arcsec_per_pixel))), ch = Math.min(G, Math.max(2, Math.round(cw * patch.height / patch.width)));
  return { cw, ch, ox: Math.floor((G - cw) / 2), oy: Math.floor((G - ch) / 2) };
}

function draw() {
  const m = state.m; if (!m) return;
  if (state.still || state.heat) stack(m);
  const G = m.grid, f = m.frames[state.i], v = view(m), { cw, ch, ox, oy } = v;
  const W = patch.width, H = patch.height, sx = W / cw, sy = H / ch;
  const img = ctx.createImageData(cw, ch);
  for (let r = 0; r < ch; r++) for (let c = 0; c < cw; c++) shade(m, f, c + ox, r + oy, img.data, 4 * (r * cw + c));
  // nearest-neighbour upscale keeps SPHEREx's real 5 arcsec pixels honest
  const tmp = new OffscreenCanvas(cw, ch); tmp.getContext('2d').putImageData(img, 0, 0);
  ctx.imageSmoothingEnabled = false; ctx.clearRect(0, 0, W, H); ctx.drawImage(tmp, 0, 0, W, H);

  const toPx = (x, y) => [(x - ox + 0.5) * sx, (G - 1 - y - oy + 0.5) * sy];   // FITS x,y (bottom origin) -> canvas
  const predPx = fr => toPx((G - 1) / 2 - fr.pred_east / m.arcsec_per_pixel, (G - 1) / 2 + fr.pred_north / m.arcsec_per_pixel);
  const shown = m.frames.slice(0, state.i + 1).filter(fr => fr.x != null);
  // the arrow claims real motion, so draw it only when Gaia or a published motion says the target moves (R Draconis does not)
  const moves = (m.gaia && m.gaia.total > 1) || m.ref;
  if (moves && shown.length > 1) {   // arrow from the first measured position toward the current one
    const [x0, y0] = toPx(shown[0].x, shown[0].y), [x1, y1] = toPx(shown.at(-1).x, shown.at(-1).y);
    const len = Math.hypot(x1 - x0, y1 - y0);
    if (len > 6) {
      const ux = (x1 - x0) / len, uy = (y1 - y0) / len, nx = -uy, ny = ux, off = 0.09 * H;
      const ax = x0 + nx * off, ay = y0 + ny * off, bx = x1 + nx * off, by = y1 + ny * off;
      ctx.strokeStyle = 'rgba(160,200,255,.9)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.stroke();
      ctx.fillStyle = 'rgba(160,200,255,.95)'; ctx.beginPath(); ctx.moveTo(bx + ux * 10, by + uy * 10); ctx.lineTo(bx - ux * 4 + nx * 6, by - uy * 4 + ny * 6); ctx.lineTo(bx - ux * 4 - nx * 6, by - uy * 4 - ny * 6); ctx.fill();
    }
  }
  shown.forEach((fr, n) => {   // ghost trail: earlier visits in blue, fading with age; this visit in orange
    const [x, y] = toPx(fr.x, fr.y), cur = fr === f, age = shown.length - 1 - n;
    ctx.beginPath(); ctx.arc(x, y, cur ? 8 : 6.5, 0, 7);
    ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(0,0,0,.8)'; ctx.stroke();   // dark outline: readable on a white star
    if (cur) { ctx.shadowColor = 'rgba(255,154,77,.9)'; ctx.shadowBlur = 18; ctx.fillStyle = '#ff9a4d'; }
    else { ctx.shadowBlur = 0; ctx.fillStyle = `rgba(127,184,255,${Math.max(0.35, 0.95 - 0.2 * (age - 1))})`; }
    ctx.fill(); ctx.shadowBlur = 0;
  });
  if (f.pred_east != null) {   // predicted position for this date (Gaia, or a published motion)
    const [gx, gy] = predPx(f);
    for (const [color, width] of [['rgba(0,0,0,.85)', 5], ['#ffffff', 2]]) {   // dark outline keeps it visible on a white star
      ctx.strokeStyle = color; ctx.lineWidth = width; ctx.beginPath(); ctx.arc(gx, gy, 15, 0, 7); ctx.stroke();
    }
  }
  // known comets (orange) and asteroids (blue) during this visit: a dot where SkyBoT put each one at each exposure time,
  // joined by a dashed path, and the name. A median of several exposures usually erases a fast mover, so a path can
  // cross empty sky: it says a known object passed through, not that the dot under it is that object.
  if (knownQueue.some(j => j[1] === f)) knownQueue.sort((a, b) => (b[1] === f) - (a[1] === f));   // the frame on screen goes next
  if (f.known) {
    ctx.font = `400 ${Math.round(H / 34)}px "Space Mono", ui-monospace, monospace`; ctx.textBaseline = 'middle';
    for (const [name, b] of f.known.bodies) {
      const color = b.kind === 'comet' ? '#ff9a4d' : '#7fb8ff';
      const px = b.pts.map(([, ra, dec]) => { const [e, n] = offset(m, ra, dec); return toPx((G - 1) / 2 - e / m.arcsec_per_pixel, (G - 1) / 2 + n / m.arcsec_per_pixel); });
      const inView = px.filter(([x, y]) => x >= 0 && y >= 0 && x <= W && y <= H);   // the path is drawn even when only it crosses the view
      for (const [c, w] of [['rgba(0,0,0,.8)', 4], [color, 1.6]]) {
        ctx.strokeStyle = c; ctx.lineWidth = w; ctx.setLineDash([5, 5]);
        if (px.length > 1) { ctx.beginPath(); px.forEach(([x, y], k) => (k ? ctx.lineTo(x, y) : ctx.moveTo(x, y))); ctx.stroke(); }
        ctx.setLineDash([]);
        for (const [x, y] of px) { ctx.beginPath(); ctx.arc(x, y, px.length > 1 ? 4 : 11, 0, 7); ctx.stroke(); }
      }
      if (!inView.length) continue;   // a name only beside a position in view
      const [lx, ly] = inView[0], left = lx > W * .7, tx = left ? lx - 16 : lx + 16;
      ctx.textAlign = left ? 'right' : 'left'; ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(0,0,0,.85)'; ctx.strokeText(name, tx, ly);
      ctx.fillStyle = color; ctx.fillText(name, tx, ly);
    }
    ctx.textAlign = 'left';
  }
  knownList(f);
  drawMini(m, f, v);
  showVisit(m, f);
  patch.setAttribute('aria-label', `SPHEREx image of ${m.name}, ${monthYear(f.start)}${state.diff && state.i > 0 ? ', difference from first visit' : ''}`);
}

// ---------- mini-map: the whole region, the big frame's part outlined, the target ringed ----------
function drawMini(m, f, v) {
  const G = m.grid, MW = mini.width, MH = mini.height, S = MH - 40, x0 = (MW - S) / 2 - 30, y0 = 20, k = S / G;   // a little left of centre: the sizes go on the right
  const img = mini2d.createImageData(G, G);
  for (let r = 0; r < G; r++) for (let c = 0; c < G; c++) shade(m, f, c, r, img.data, 4 * (r * G + c));
  const tmp = new OffscreenCanvas(G, G); tmp.getContext('2d').putImageData(img, 0, 0);
  mini2d.clearRect(0, 0, MW, MH); mini2d.imageSmoothingEnabled = false; mini2d.drawImage(tmp, x0, y0, S, S);
  // dim the region outside the big frame's part, then outline that part in white
  const bx = x0 + v.ox * k, by = y0 + v.oy * k, bw = v.cw * k, bh = v.ch * k;
  mini2d.fillStyle = 'rgba(0,0,0,.5)'; mini2d.beginPath(); mini2d.rect(x0, y0, S, S); mini2d.rect(bx, by, bw, bh); mini2d.fill('evenodd');
  mini2d.strokeStyle = 'rgba(255,255,255,.35)'; mini2d.lineWidth = 2; mini2d.strokeRect(x0, y0, S, S);
  mini2d.strokeStyle = '#fff'; mini2d.lineWidth = 3; mini2d.strokeRect(bx, by, bw, bh);
  // the target: where it was measured this visit, or the middle of the region
  const tx = f.x != null ? f.x : (G - 1) / 2, ty = f.y != null ? f.y : (G - 1) / 2;
  const px = x0 + (tx + 0.5) * k, py = y0 + (G - 1 - ty + 0.5) * k;
  for (const [color, width] of [['rgba(0,0,0,.8)', 7], ['#ff9a4d', 3]]) { mini2d.strokeStyle = color; mini2d.lineWidth = width; mini2d.beginPath(); mini2d.arc(px, py, 11, 0, 7); mini2d.stroke(); }
  // the sizes: the whole region beside it, the frame's part under it
  const arcmin = G * m.arcsec_per_pixel / 60;
  mini2d.fillStyle = 'rgba(255,255,255,.85)'; mini2d.font = '40px "Space Mono", ui-monospace, monospace'; mini2d.textBaseline = 'bottom';
  mini2d.fillText(`${+arcmin.toFixed(1)}′`, x0 + S + 14, y0 + S);
  mini2d.textBaseline = 'top'; mini2d.fillText(`${+(v.cw * m.arcsec_per_pixel / 60).toFixed(1)}′`, x0 + S + 14, y0);
  mini.setAttribute('aria-label', `The whole ${+arcmin.toFixed(1)} arcmin region; the outlined box is the ${state.fov} arcmin the big frame shows, the ring is the target`);
}

function showVisit(m, f) {
  document.getElementById('vVisit').innerHTML =
    `<b>${monthYear(f.start)}</b>: ${f.exposures} exposure${f.exposures > 1 ? 's' : ''} at ${f.lam.toFixed(3)} µm` +
    (f.saturated_px ? '. White core: detector saturated' : '') + (state.diff && state.i === 0 ? '. The reference for Color Difference' : '');
  timeline.show(m, state.i);
}

function panel(m) {
  const mo = m.motion, g = m.gaia, el = document.getElementById('vMotion');
  const ref = g && g.total > 1 ? { total: g.total, label: 'Gaia', tol: 20 } : m.ref ? { total: m.ref.total, label: m.ref.source, tol: 35 } : null;

      out.data[j] = src[i]; out.data[j + 1] = src[i + 1]; out.data[j + 2] = src[i + 2]; out.data[j + 3] = 255;
    }
    mapBase = out;
  };
}
function drawMap() {
  mctx.clearRect(0, 0, MW, MH);
  if (mapBase) mctx.putImageData(mapBase, 0, 0);
  mctx.strokeStyle = 'rgba(160,190,230,.5)'; mctx.lineWidth = 1; mctx.beginPath(); mctx.ellipse(MW / 2, MH / 2, MW / 2 - 1, MH / 2 - 1, 0, 0, 7); mctx.stroke();
  for (const { t } of marks) { const m = mapMarks[t.key]; if (!m) continue; const [x, y] = mollForward(m.ra, m.dec); mctx.fillStyle = '#cfe6ff'; mctx.beginPath(); mctx.arc(x, y, 3, 0, 7); mctx.fill(); }
  const [vx, vy] = mollForward(sky.ra, sky.dec), r = Math.max(4, sky.fov / 360 * MW / 2);   // where you are looking
  mctx.strokeStyle = '#ff9a4d'; mctx.lineWidth = 2; mctx.beginPath(); mctx.arc(vx, vy, r, 0, 7); mctx.stroke();
}
const mapMarks = {};
window.__sky = { sky, pointToRadec, radecToPoint, mollForward, mollInverse, pickSpot };   // for tests/skymap checks
TARGETS.forEach(t => load(t.key).then(m => { mapMarks[t.key] = m; }).catch(() => {}));
mapEl.addEventListener('click', e => {
  const b = mapEl.getBoundingClientRect(), rd = mollInverse((e.clientX - b.left) / b.width * MW, (e.clientY - b.top) / b.height * MH);
  if (!rd) return;
  if (!renderer) {   // no 3D sky to fly through: open that spot's time-lapse straight away
    document.getElementById('coords').value = `${rd[0].toFixed(4)} ${rd[1].toFixed(4)}`;
    return search(rd[0], rd[1], document.getElementById('det').value, { diff: true });
  }
  [sky.ra, sky.dec] = rd; sky.fovGoal = 6;
});

// ---------- loop: the star field drifts slowly behind the time-lapse ----------
function frame(now) {
  requestAnimationFrame(frame);
  const frameStart = performance.now();
  if (state.mode === 'sky') {
    // in sky mode the camera sits at the Sun, so every direction on screen is a true RA/Dec
    sky.fov += (sky.fovGoal - sky.fov) * 0.15;
    camera.fov = sky.fov; camera.updateProjectionMatrix();
    dirRaDec(sky.ra * D2R, sky.dec * D2R, look); lookGoal.copy(look);
    camera.position.set(0, 0, 0); camera.lookAt(look);
    for (const { t, el } of marks) {
      const m = mapMarks[t.key], p = m && radecToPoint(m.ra, m.dec);
      el.style.display = p ? 'flex' : 'none';
      if (p) { el.style.left = `${p[0]}px`; el.style.top = `${p[1]}px`; }
    }
    if (now - (sky.lastMap || 0) > 100) { sky.lastMap = now; drawMap(); }
  } else {
    if (camera.fov !== 50) { camera.fov = 50; camera.updateProjectionMatrix(); }
    look.lerp(lookGoal, 0.04).normalize();
    const side = new THREE.Vector3().crossVectors(look, up).normalize();
    camera.position.copy(look).multiplyScalar(-0.6).addScaledVector(side, Math.sin(now / 9000) * 0.25);
    camera.lookAt(camera.position.clone().add(look));
  }
  world?.update(now, frameStart);
  if (state.playing && state.m && now - state.last > 900) { state.last = now; state.i = (state.i + 1) % state.m.frames.length; draw(); }
  renderer?.render(scene, camera);
}
requestAnimationFrame(frame);
if (P.has('ra') && P.has('dec')) {
  const det = /^D[1-6]$/.test(P.get('det')) ? P.get('det') : 'D1';
  document.getElementById('coords').value = `${P.get('ra')} ${P.get('dec')}`; document.getElementById('det').value = det;
  search(Number(P.get('ra')), Number(P.get('dec')), det, { diff: P.get('diff') === '1' });
} else if (TARGETS.some(t => t.key === P.get('target'))) select(P.get('target'), { diff: P.get('diff') === '1' });
else setMode('sky');   // the whiteboard flow starts at the whole sky
</script>
